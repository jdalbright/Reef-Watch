[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reef-watch"
version = "0.1.0"
description = "Local camera observations for a reef aquarium"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=2,<3", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
reef-watch = "reefwatch.__main__:main"

[tool.setuptools.package-data]
reefwatch = ["static/*", "static/assets/*"]

[tool.setuptools.packages.find]
include = ["reefwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
